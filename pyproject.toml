[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "titanium-video-downloader"
version = "0.1.0"
description = "Streaming video downloader with pluggable site extractors (CLI first)"
requires-python = "==3.12.*"
dependencies = [
  "requests",
  "tqdm",
]

[project.optional-dependencies]
browser = ["playwright"]
ffmpeg = ["imageio-ffmpeg==0.6.0"]
test = ["pytest"]

[project.scripts]
ti22-video-dl = "titanium_video_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["titanium_video_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
