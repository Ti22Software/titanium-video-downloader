[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "titanium-downloader"
version = "0.1.0"
description = "Single-file-first streaming video downloader with pluggable site extractors (CLI first)"
requires-python = "==3.12.*"
dependencies = [
  "requests",
  "tqdm",
]

[project.optional-dependencies]
browser = ["playwright"]
test = ["pytest"]

[project.scripts]
ti22-dl = "titanium_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["titanium_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
